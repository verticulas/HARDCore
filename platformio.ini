[platformio]
default_envs = tx, rx

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

[env:tx]
build_src_filter = +<transmitter.cpp>
lib_deps = arduino-libraries/LiquidCrystal
upload_port = /dev/serial/by-id/usb-Arduino...TX...
monitor_port = /dev/serial/by-id/usb-Arduino...TX...

[env:rx]
build_src_filter = +<reciever.cpp>
lib_deps = marcoschwartz/LiquidCrystal_I2C
upload_port = /dev/serial/by-id/usb-Arduino...RX...
monitor_port = /dev/serial/by-id/usb-Arduino...RX...